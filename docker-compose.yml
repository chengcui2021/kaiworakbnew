services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: metamorphic
      POSTGRES_PASSWORD: metamorphic
      POSTGRES_DB: metamorphic_kb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metamorphic -d metamorphic_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: metamorphic-kb-backend:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metamorphic:metamorphic@db:5432/metamorphic_kb
      PYTHONUNBUFFERED: "1"
      DEBUG: "false"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      BEDROCK_EMBEDDING_DIMENSIONS: ${BEDROCK_EMBEDDING_DIMENSIONS:-1024}
      BEDROCK_LLM_MODEL_ID: ${BEDROCK_LLM_MODEL_ID:-qwen.qwen3-235b-a22b-2507-v1:0}
      BEDROCK_LLM_MAX_TOKENS: ${BEDROCK_LLM_MAX_TOKENS:-10000}
      BEDROCK_LLM_TEMPERATURE: ${BEDROCK_LLM_TEMPERATURE:-0.3}

  frontend:
    build: ./frontend
    image: metamorphic-kb-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL:

volumes:
  postgres_data:
    external: true
    name: kb_postgres_data
