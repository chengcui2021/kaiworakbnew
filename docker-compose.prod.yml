# Production deployment for EC2 + prebuilt images.
# API_IMAGE and WEB_IMAGE must be set by the deploy workflow/script.

services:
  backend:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
